stages:
  - build
  - push

variables:
  IMAGE_NAME: registry.gitlab.com/samishafique786/aws-ci-cd

before_script:
  # Login using personal access token
  - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin registry.gitlab.com

build_image:
  stage: build
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  script:
    - ddocker build -f hello-prometheus/Dockerfile -t $IMAGE_NAME:$CI_COMMIT_SHA .
  only:
    - main

push_image:
  stage: push
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  script:
    - docker push $IMAGE_NAME:$CI_COMMIT_SHA
  only:
    - main
