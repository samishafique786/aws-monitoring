#cloud-config
package_update: true
packages:
  - wget
  - tar

write_files:
  - path: /etc/prometheus/prometheus.yml
    content: ${jsonencode(prometheus_config)}
    permissions: '0644'

runcmd:
  - useradd --no-create-home --shell /bin/false prometheus
  - mkdir -p /etc/prometheus
  - mkdir -p /var/lib/prometheus
  - chown prometheus:prometheus /etc/prometheus
  - chown prometheus:prometheus /var/lib/prometheus
  - cd /tmp
  - wget https://github.com/prometheus/prometheus/releases/download/v2.45.0/prometheus-2.45.0.linux-amd64.tar.gz
  - tar -xvf prometheus-2.45.0.linux-amd64.tar.gz
  - cp prometheus-2.45.0.linux-amd64/prometheus /usr/local/bin/
  - cp prometheus-2.45.0.linux-amd64/promtool /usr/local/bin/
  - chown prometheus:prometheus /usr/local/bin/prometheus
  - chown prometheus:prometheus /usr/local/bin/promtool
  - cp -r prometheus-2.45.0.linux-amd64/consoles /etc/prometheus
  - cp -r prometheus-2.45.0.linux-amd64/console_libraries /etc/prometheus
  - chown prometheus:prometheus /etc/prometheus/prometheus.yml
  - chown -R prometheus:prometheus /etc/prometheus/consoles
  - chown -R prometheus:prometheus /etc/prometheus/console_libraries
  
  - |
    cat <<EOF > /etc/systemd/system/prometheus.service
    [Unit]
    Description=Prometheus
    Wants=network-online.target
    After=network-online.target

    [Service]
    User=prometheus
    Group=prometheus
    Type=simple
    ExecStart=/usr/local/bin/prometheus \
        --config.file /etc/prometheus/prometheus.yml \
        --storage.tsdb.path /var/lib/prometheus/ \
        --web.console.templates=/etc/prometheus/consoles \
        --web.console.libraries=/etc/prometheus/console_libraries

    [Install]
    WantedBy=multi-user.target
    EOF
  - systemctl daemon-reload
  - systemctl start prometheus
  - systemctl enable prometheus

  # Install Node Exporter
  - wget https://github.com/prometheus/node_exporter/releases/download/v1.7.0/node_exporter-1.7.0.linux-amd64.tar.gz
  - tar -xvf node_exporter-1.7.0.linux-amd64.tar.gz
  - cp node_exporter-1.7.0.linux-amd64/node_exporter /usr/local/bin/
  - useradd --no-create-home --shell /bin/false node_exporter
  - chown node_exporter:node_exporter /usr/local/bin/node_exporter
  - |
    cat <<EOF > /etc/systemd/system/node_exporter.service
    [Unit]
    Description=Node Exporter
    Wants=network-online.target
    After=network-online.target

    [Service]
    User=node_exporter
    Group=node_exporter
    Type=simple
    ExecStart=/usr/local/bin/node_exporter

    [Install]
    WantedBy=multi-user.target
    EOF
  - systemctl daemon-reload
  - systemctl start node_exporter
  - systemctl enable node_exporter

  # Install Grafana
  - apt-get install -y apt-transport-https software-properties-common wget
  - mkdir -p /etc/apt/keyrings/
  - wget -q -O - https://apt.grafana.com/gpg.key | gpg --dearmor | tee /etc/apt/keyrings/grafana.gpg > /dev/null
  - echo "deb [signed-by=/etc/apt/keyrings/grafana.gpg] https://apt.grafana.com stable main" | tee /etc/apt/sources.list.d/grafana.list
  - apt-get update
  - apt-get install -y grafana
  - systemctl daemon-reload
  - systemctl start grafana-server
  - systemctl enable grafana-server
